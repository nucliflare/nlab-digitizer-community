name: build-lmde7
on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: LMDE 7 / Debian 13 (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # LMDE 7 uses Debian 13 userspace. Keep Python and native libraries on
    # trixie rather than building against the Ubuntu runner's libraries.
    container:
      image: python:3.12-trixie
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v7

      - name: Verify build platform
        run: |
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13
          test "$(uname -m)" = x86_64
          cat /etc/os-release
          python --version
          ldd --version

      - name: Verify tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_tag.py

      - name: Install native IIO and Qt runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libdbus-1-3 libiio0 libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            patchelf

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install locked dependencies
        run: python -m uv sync --locked --extra dev --python /usr/local/bin/python

      - name: Verify native libiio runtime
        run: .venv/bin/python -c "import iio; print(f'libiio {iio.version}')"

      - name: Generate UI modules
        run: .venv/bin/python scripts/build_ui.py

      - name: Lint
        continue-on-error: true
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m mypy src/nlab

      - name: Test
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -X faulthandler -m pytest -vv -o faulthandler_timeout=60 --basetemp=.pytest-tmp

      - name: Build
        run: .venv/bin/python scripts/build_pyinstaller_reviewed.py --clean

      - name: Package LMDE 7 build
        run: tar -czf dist/nlab-lmde7-x86_64.tar.gz -C dist nlab

      - uses: actions/upload-artifact@v7
        with:
          name: nlab-lmde7-x86_64
          path: dist/nlab-lmde7-x86_64.tar.gz
          if-no-files-found: error
