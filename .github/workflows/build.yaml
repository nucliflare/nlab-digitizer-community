name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
            python-exe: python
            venv-python: .venv/Scripts/python.exe
            package: dist/nlab-windows.zip
          - name: ubuntu
            runs-on: ubuntu-latest
            python-exe: python3
            venv-python: .venv/bin/python
            package: dist/nlab-ubuntu.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: ${{ matrix.python-exe }} scripts/check_release_tag.py

      - name: Install Qt runtime deps (Linux only)
        if: matrix.name == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 patchelf

      - name: Install uv
        run: ${{ matrix.python-exe }} -m pip install --upgrade uv

      - name: Install locked dependencies
        run: ${{ matrix.python-exe }} -m uv sync --locked --extra dev

      - name: Generate UI modules
        run: ${{ matrix.venv-python }} scripts/build_ui.py

      - name: Generate gRPC stubs
        run: ${{ matrix.venv-python }} scripts/generate_proto.py

      - name: Lint
        continue-on-error: true
        run: |
          ${{ matrix.venv-python }} -m ruff check .
          ${{ matrix.venv-python }} -m mypy src/nlab

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ${{ matrix.venv-python }} -m pytest

      - name: Build
        run: ${{ matrix.venv-python }} scripts/build_pyinstaller_reviewed.py --clean

      - name: Package build (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/nlab.exe -DestinationPath ${{ matrix.package }} -Force

      - name: Package build (Linux)
        if: matrix.name == 'ubuntu'
        run: tar -czf ${{ matrix.package }} -C dist nlab

      - uses: actions/upload-artifact@v7
        with:
          name: nlab-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
          generate_release_notes: true
