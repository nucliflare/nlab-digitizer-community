name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-latest
            python-exe: python
            venv-python: .venv/Scripts/python.exe
            package: dist/nlab.exe
          - name: ubuntu
            runs-on: ubuntu-latest
            python-exe: python3
            venv-python: .venv/bin/python
            package: dist/nlab-ubuntu.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: ${{ matrix.python-exe }} scripts/check_release_tag.py

      - name: Install Qt runtime deps (Linux only)
        if: matrix.name == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libiio0 libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 patchelf

      - name: Install native libiio runtime (Windows only)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "libiio-v0.26-windows.zip"
          $destination = Join-Path $env:RUNNER_TEMP "libiio-v0.26"
          Invoke-WebRequest `
            -Uri "https://github.com/analogdevicesinc/libiio/releases/download/v0.26/Windows.zip" `
            -OutFile $archive

          $expectedHash = "4AD4A8C6B3F7145922C122DCFC51D693F0D3F9A0054FB2228814CE58C538A6CA"
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Unexpected SHA-256 for the libiio v0.26 Windows archive: $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $runtime = Join-Path $destination "Windows-VS-2022-x64"
          if (-not (Test-Path -LiteralPath (Join-Path $runtime "libiio.dll"))) {
            throw "The libiio v0.26 Windows runtime does not contain libiio.dll"
          }
          $runtime | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install uv
        run: ${{ matrix.python-exe }} -m pip install --upgrade uv

      - name: Install locked dependencies
        run: ${{ matrix.python-exe }} -m uv sync --locked --extra dev

      - name: Verify native libiio runtime
        run: ${{ matrix.venv-python }} -c "import iio; print(f'libiio {iio.version}')"

      - name: Generate UI modules
        run: ${{ matrix.venv-python }} scripts/build_ui.py

      - name: Generate gRPC stubs
        run: ${{ matrix.venv-python }} scripts/generate_proto.py

      - name: Lint
        continue-on-error: true
        run: |
          ${{ matrix.venv-python }} -m ruff check .
          ${{ matrix.venv-python }} -m mypy src/nlab

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        # Match Gitea's workspace-local temp root so both CI providers exercise
        # the same test invocation on Windows and Linux.
        run: ${{ matrix.venv-python }} -m pytest --basetemp=.pytest-tmp

      - name: Build
        run: ${{ matrix.venv-python }} scripts/build_pyinstaller_reviewed.py --clean

      - name: Package build (Linux)
        if: matrix.name == 'ubuntu'
        run: tar -czf ${{ matrix.package }} -C dist nlab

      - uses: actions/upload-artifact@v7
        with:
          name: nlab-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package Windows release archive
        run: |
          cd dist/nlab-windows
          python3 -m zipfile -c nlab-windows.zip nlab.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
          generate_release_notes: true
