[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlab"
version = "0.9.9"
description = "Device communication and measurement GUI application"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Kamil Brylew", email = "kamil.brylew@nuclear-lab.com" },
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<6.10",
    "pyqtgraph>=0.13",
    "numpy>=2.0",
    "scipy>=1.13",
    "lmfit>=1.3.4,<2",
    "matplotlib>=3.9",
    "reportlab>=4.2,<5",
    "fast_histogram>=0.11",
    "h5py>=3.11",
    "uproot>=5.7",
    "pyyaml>=6.0",
    "xmlschema>=4.3,<5",
    "nlab-modbus",
    "pylibiio>=0.25,<1",
]

[project.optional-dependencies]
dev = [
    # Build & code generation
    "nuitka>=2.4",
    "ordered-set",          # required by nuitka --onefile
    "zstandard",            # required by nuitka --onefile compression
    "pyinstaller>=6.8",
    # Licensing
    "pip-licenses>=5.0",
    # Testing
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pypdf>=5",
    "jupyter>=1.1",
    # Linting / type checking
    "ruff>=0.4",
    "mypy>=1.10",
    # Versioning
    "bump-my-version",
]

[project.scripts]
nlab = "nlab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nlab = ["py.typed", "data/*.sqlite3", "data/*.xsd", "data/*.sch", "data/help/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by scripts/build_ui.py (pyside6-uic / pyside6-rcc); untracked and
# rewritten on every build, so lint findings there are not actionable.
extend-exclude = ["src/nlab/ui/ui_*.py", "src/nlab/ui/*_rc.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Walkthrough notebooks are executed in place against hardware and stored with
# their captured outputs (see AGENTS.md). Their setup cells deliberately insert
# ../src into sys.path before importing nlab. Rewrapping source without
# re-executing would desync code from recorded output, so only style rules are
# relaxed here; correctness rules (F8xx, E9xx, ...) still apply.
"notebooks/*.ipynb" = ["E501", "I001", "F401"]

[tool.ruff.lint.pep8-naming]
# Shaping-filter accessors keep the established physics symbols (trapezoid
# R/M/T/E/FT, CR-RC2 Cdelay/Fdelay) as part of the public backend/MCA API.
ignore-names = [
    "get_R", "set_R", "get_M", "set_M", "get_T", "set_T", "get_E", "set_E",
    "get_FT", "set_FT", "get_Cdelay", "set_Cdelay", "get_Fdelay", "set_Fdelay",
    "get_trapez_R", "set_trapez_R", "get_trapez_M", "set_trapez_M",
    "get_trapez_T", "set_trapez_T", "get_trapez_E", "set_trapez_E",
    "get_trapez_FT", "set_trapez_FT",
    "get_crrc2_Cdelay", "set_crrc2_Cdelay", "get_crrc2_Fdelay", "set_crrc2_Fdelay",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Generated Qt modules have no annotations; calling setupUi() is expected.
untyped_calls_exclude = ["nlab.ui"]

[[tool.mypy.overrides]]
# Generated by scripts/build_ui.py; untracked and rewritten on every build.
module = ["nlab.ui.*"]
ignore_errors = true

[tool.bumpversion]
current_version = "0.9.9"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
message = "chore: bump version {current_version} -> {new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "src/nlab/_version.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[project.urls]
Repository = "https://github.com/nucliflare/nlab-digitizer-community"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
nlab-modbus = { git = "https://github.com/nucliflare/nlab-modbus", tag = "v0.3.0" }
