name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: windows-local
            python-exe: python
            venv-python: .venv/Scripts/python.exe
            package: dist/nlab-windows.zip
          - name: ubuntu
            runs-on: ubuntu-local
            python-exe: python3
            venv-python: .venv/bin/python
            package: dist/nlab-ubuntu.tar.gz
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.name == 'windows'
        with:
          python-version: "3.12"

      - name: Install Qt runtime deps (Linux only)
        if: matrix.name == 'ubuntu'
        run: |
          apt-get update
          apt-get install -y libdbus-1-3 libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 patchelf

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: ${{ matrix.python-exe }} scripts/check_release_tag.py

      - name: Create venv (Windows)
        if: matrix.name == 'windows'
        run: python -m venv .venv

      - name: Create venv (Linux - uv downloads Python 3.12 automatically)
        if: matrix.name == 'ubuntu'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.12 --seed .venv

      - name: Install locked dependencies
        run: |
          ${{ matrix.venv-python }} -m pip install --upgrade pip uv
          ${{ matrix.venv-python }} -m uv sync --locked --extra dev

      - name: Generate UI modules
        run: ${{ matrix.venv-python }} scripts/build_ui.py

      - name: Generate gRPC stubs
        run: ${{ matrix.venv-python }} scripts/generate_proto.py

      - name: Lint
        if: false
        continue-on-error: true
        run: |
          ${{ matrix.venv-python }} -m ruff check .
          ${{ matrix.venv-python }} -m mypy src/nlab

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ${{ matrix.venv-python }} -m pytest

      - name: Build
        run: ${{ matrix.venv-python }} scripts/build_pyinstaller_reviewed.py --clean

      - name: Package build (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/nlab.exe -DestinationPath ${{ matrix.package }} -Force

      - name: Package build (Linux)
        if: matrix.name == 'ubuntu'
        run: tar -czf ${{ matrix.package }} -C dist nlab

      - name: Upload artifact
        # Gitea uses the v3 artifact protocol; pin Node 20 to match the other
        # actions used by the self-hosted runners instead of floating to Node 24.
        uses: actions/upload-artifact@v3-node20
        with:
          name: nlab-${{ matrix.name }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-local
    permissions:
      actions: read
      releases: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3-node20
        with:
          path: dist

      - name: Create Gitea Release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          token: ${{ secrets.GITEA_TOKEN }}
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
